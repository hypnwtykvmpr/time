# Validate only the Time fork with upstream locked checks on each supported OS.
name: Time

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: time-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Time (${{ matrix.os }}, Python ${{ matrix.python }})
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          python-version: ${{ matrix.python }}
          enable-cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Locked sync, lint, format, types, tests and build
        run: node scripts/validate-py.mjs time
      - name: Per-file coverage
        run: node scripts/coverage-py.mjs time
      - name: Verify the lockfile was preserved
        run: git diff --exit-code -- src/time/uv.lock
